set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on

set -g focus-events on
set -g escape-time 0
set -g history-limit 50000
set -g status-interval 5
set -g status-keys emacs

# -c: preserve cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

bind r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display "Config reloaded"

# set -g default-terminal "tmux-256color"
set -g default-terminal "screen-256color" # wider compatibility
# Enable true color (24-bit) support
set -ga terminal-overrides ",xterm-256color:Tc"

if-shell "test -f \"$XDG_CONFIG_HOME/tmux/tmux.local.conf\"" \
  "source-file \"$XDG_CONFIG_HOME/tmux/tmux.local.conf\""
